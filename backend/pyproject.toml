[project]
name = "foodgram"
version = "0.1.0"
description = "Foodgram: a recipe-sharing service with a REST API"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.18,<5.3",
    "django-colorfield>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djoser>=2.3.4",
    "drf-extra-fields>=3.7.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

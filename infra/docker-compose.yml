services:

  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data/
    # Only the variables PostgreSQL needs: the database gets no Django
    # secrets and is not recreated when other values in .env change.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Created on the first start of an empty volume.
      POSTGRES_DB: ${DB_NAME:-postgres}
    healthcheck:
      # Checked over TCP: while the entrypoint initializes a new volume,
      # the temporary server listens only on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: absentkai/foodgram:latest
    restart: always
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env

  frontend:
    image: absentkai/frontend:latest
    volumes:
      - ../frontend/:/app/result_build/
    depends_on:
      - web

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/build:/usr/share/nginx/html/:ro
      - ../docs/:/var/html/api/docs/:ro
      - static_value:/var/html/static/:ro
      - media_value:/var/html/media/:ro
    depends_on:
      - web
      - frontend
    restart: always

volumes:
  static_value:
  media_value:
  db_data:
